[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-edge-simulator"
version = "1.0.0"
description = "Deterministic cloud-edge-device placement strategy simulator"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
cloud-edge = "cloud_edge.cli:main"

[tool.setuptools.packages.find]
include = ["cloud_edge*"]
